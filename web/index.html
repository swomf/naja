<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>naja</title>
<link rel="stylesheet" href="web/styles.css">
</head>
<body>

{{range .Videos}}
  {{$vid := .}}
  <div class="card" data-id="{{$vid.ID}}" data-basename="{{$vid.BaseName}}">
    <h3>{{$vid.BaseName}}</h3>

    <div class="video-container" id="{{$vid.ID}}-container">
      <img src="/thumbnails/{{$vid.BaseName}}.jpg"
           alt="{{$vid.BaseName}} thumbnail"
           class="thumb"
           data-action="load"
           data-id="{{$vid.ID}}"
           data-src="/video/{{index $vid.Versions 0}}" />
    </div>

    <div class="buttons">
      {{range $vid.Versions}}
        <button class="btn"
                data-action="switch"
                data-src="/video/{{.}}"
                data-id="{{$vid.ID}}">
          {{.}}
        </button>
      {{end}}
    </div>
  </div>
{{end}}

<script src="/web/index.js"></script>
</body>
</html>
